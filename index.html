<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 МЕГА ТАПАЛКА 1B</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Верхняя панель -->
        <div class="header">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">💵 Баланс</span>
                    <span class="stat-value" id="coinCounter">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⚡ Энергия</span>
                    <div class="energy-bar">
                        <div class="energy-fill" id="energyFill"></div>
                    </div>
                    <span class="stat-value small" id="energyCounter">500/500</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📊 Уровень</span>
                    <span class="stat-value" id="levelDisplay">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🏅 Престиж</span>
                    <span class="stat-value" id="prestigeDisplay">0</span>
                </div>
            </div>
        </div>

        <!-- Монета -->
        <div class="coin-wrapper">
            <div class="coin-glow"></div>
            <img id="coinImage" src="https://emojicdn.elk.sh/💵" alt="Доллар">
            <div id="floatingTexts"></div>
        </div>

        <!-- Инфо -->
        <div class="income-info">
            <span>💹 Доход/сек: <span id="incomeDisplay">0</span></span>
            <span>💪 Сила тапа: <span id="tapPowerDisplay">1</span></span>
        </div>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="upgrades">⬆️ Улучшения</button>
            <button class="tab-btn" data-tab="business">🏢 Бизнес</button>
            <button class="tab-btn" data-tab="energy">⚡ Энергия</button>
            <button class="tab-btn" data-tab="bonus">🎁 Бонусы</button>
        </div>

        <!-- Контент -->
        <div class="shop-content">
            <!-- Вкладка Улучшений (10 уровней до 1B) -->
            <div class="tab-panel active" id="tab-upgrades">
                <button class="shop-btn upgrade" onclick="buyUpgrade(0)"><span class="icon">⬆️</span><span class="text">Улучшить тап</span><span class="price" id="upgradeCost0">50 💵</span></button>
                <button class="shop-btn mega" onclick="buyUpgrade(1)"><span class="icon">🚀</span><span class="text">Мега-тап</span><span class="price" id="upgradeCost1">200 💵</span></button>
                <button class="shop-btn ultra" onclick="buyUpgrade(2)"><span class="icon">💎</span><span class="text">Ультра-тап</span><span class="price" id="upgradeCost2">1 000 💵</span></button>
                <button class="shop-btn legendary" onclick="buyUpgrade(3)"><span class="icon">⭐</span><span class="text">Легендарный тап</span><span class="price" id="upgradeCost3">10 000 💵</span></button>
                <button class="shop-btn mythic" onclick="buyUpgrade(4)"><span class="icon">🔥</span><span class="text">Мифический тап</span><span class="price" id="upgradeCost4">100 000 💵</span></button>
                <button class="shop-btn divine" onclick="buyUpgrade(5)"><span class="icon">👑</span><span class="text">Божественный тап</span><span class="price" id="upgradeCost5">1 000 000 💵</span></button>
                <button class="shop-btn cosmic" onclick="buyUpgrade(6)"><span class="icon">🌌</span><span class="text">Космический тап</span><span class="price" id="upgradeCost6">10 000 000 💵</span></button>
                <button class="shop-btn omega" onclick="buyUpgrade(7)"><span class="icon">⚡</span><span class="text">Омега-тап</span><span class="price" id="upgradeCost7">100 000 000 💵</span></button>
                <button class="shop-btn infinity" onclick="buyUpgrade(8)"><span class="icon">♾️</span><span class="text">Бесконечный тап</span><span class="price" id="upgradeCost8">500 000 000 💵</span></button>
                <button class="shop-btn ultimate" onclick="buyUpgrade(9)"><span class="icon">💀</span><span class="text">УЛЬТИМАТУМ</span><span class="price" id="upgradeCost9">1 000 000 000 💵</span></button>
            </div>

            <!-- Вкладка Бизнеса (10 уровней до 1B) -->
            <div class="tab-panel" id="tab-business">
                <button class="shop-btn business" onclick="buyBusiness(0)"><span class="icon">🥤</span><span class="text">Ларёк (+10/сек)</span><span class="price" id="businessCost0">500 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(1)"><span class="icon">🏪</span><span class="text">Магазин (+50/сек)</span><span class="price" id="businessCost1">2 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(2)"><span class="icon">🏬</span><span class="text">Супермаркет (+300/сек)</span><span class="price" id="businessCost2">10 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(3)"><span class="icon">🏭</span><span class="text">Завод (+1 500/сек)</span><span class="price" id="businessCost3">50 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(4)"><span class="icon">🚚</span><span class="text">Логистика (+8 000/сек)</span><span class="price" id="businessCost4">200 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(5)"><span class="icon">🏗️</span><span class="text">Стройка (+50 000/сек)</span><span class="price" id="businessCost5">1 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(6)"><span class="icon">🛢️</span><span class="text">Нефть (+300 000/сек)</span><span class="price" id="businessCost6">5 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(7)"><span class="icon">🛸</span><span class="text">Космос (+2 000 000/сек)</span><span class="price" id="businessCost7">25 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(8)"><span class="icon">🏦</span><span class="text">Банк (+15 000 000/сек)</span><span class="price" id="businessCost8">100 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(9)"><span class="icon">🌍</span><span class="text">Корпорация (+100 000 000/сек)</span><span class="price" id="businessCost9">500 000 000 💵</span></button>
            </div>

            <!-- Вкладка Энергии -->
            <div class="tab-panel" id="tab-energy">
                <button class="shop-btn energy-buy" onclick="buyEnergy()"><span class="icon">🔋</span><span class="text">Восстановить энергию</span><span class="price" id="energyCostDisplay">50 💵</span></button>
                <button class="shop-btn energy-max" onclick="buyMaxEnergy()"><span class="icon">📈</span><span class="text">Увеличить максимум</span><span class="price" id="maxEnergyCostDisplay">100 💵</span></button>
                <button class="shop-btn energy-regen" onclick="buyRegenSpeed()"><span class="icon">⚡</span><span class="text">Ускорить регенерацию</span><span class="price" id="regenCostDisplay">200 💵</span></button>
                <div class="energy-info">
                    <span>⚡ Максимум: <span id="maxEnergyDisplay">500</span></span>
                    <span>🔄 Регенерация: <span id="regenSpeedDisplay">1/сек</span></span>
                </div>
            </div>

            <!-- Вкладка Бонусов -->
            <div class="tab-panel" id="tab-bonus">
                <button class="shop-btn bonus" onclick="claimDailyBonus()"><span class="icon">📅</span><span class="text">Ежедневный бонус</span><span class="price" id="bonusTimer">Готово!</span></button>
                <button class="shop-btn bonus" onclick="buyLuck()"><span class="icon">🍀</span><span class="text">Удача (x2 на 30 сек)</span><span class="price">300 💵</span></button>
                <button class="shop-btn bonus" onclick="playLottery()"><span class="icon">🎰</span><span class="text">Лотерея (x2-x10)</span><span class="price">100 💵</span></button>
                <button class="shop-btn bonus" onclick="buyOffshore()"><span class="icon">🛡️</span><span class="text">Офшор (защита от налогов)</span><span class="price" id="offshorePrice">5 000 💵</span></button>
                <button class="shop-btn prestige-btn" onclick="doPrestige()"><span class="icon">🔄</span><span class="text">ПРЕСТИЖ</span><span class="price">⭐ +1</span></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
